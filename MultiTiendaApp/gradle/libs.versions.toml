[versions]
agp = "9.3.1" #Habria que bajar a 8.11.1  para compatibilidad con hilt y compose
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
firebase-bom-v = "34.17.0"
google-services-v = "4.5.0"
hilt-v = "2.60.1"
#Para usar hilt MVVM:
hiltNavigationCompose-v = "1.4.0"
#Procesador de anotaciones moderno: reempl a kap:
ksp-v = "2.3.5"
#coil se usa para cargar imagenes desde urls internet, por ej de la BBDD de Firestore:
coil-v = "2.7.0"
#Navegacion entre pantallas: navHost y navGraph: de jetpackcompose:
nav-v = "2.9.8"
material3 = "1.4.0"
litertSupportApi = "1.4.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom-v" }
#auth permite manejar autentic: logins, reg de usuarios contraseñas y su recuperacion:
firebase-auth = { group = "com.google.firebase", name = "firebase-auth"}
#firestore permite manejar BBDD noSql en T Real en la nube(firebase):
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore"}
#storage permite manejar almacenamiento de archivos en la nube(firebase): img, videos, pdf, etc:
firebase-storage = { group = "com.google.firebase", name = "firebase-storage"}

#Lib para inyeccion de dependencias:
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt-v" }
#Procesador para vgrar el codigo automaticamente:
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt-v" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose-v" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "nav-v" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil-v" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
litert-support-api = { group = "com.google.ai.edge.litert", name = "litert-support-api", version.ref = "litertSupportApi" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-service = { id = "com.google.gms.google-services", version.ref = "google-services-v" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-v" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt-v" }

